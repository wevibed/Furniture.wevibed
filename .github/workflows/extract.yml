name: Extract Website ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP into repository
        run: |
          ZIP_FILE="haven-lounge-site.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p extracted-site
          unzip -o "$ZIP_FILE" -d extracted-site

          shopt -s dotglob nullglob

          for item in extracted-site/*; do
            name="$(basename "$item")"

            if [ "$name" = ".github" ]; then
              mkdir -p .github
              cp -a "$item"/. .github/
            else
              rm -rf -- "$name"
              mv -- "$item" .
            fi
          done

          rm -rf extracted-site

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract website ZIP"
            git push
          fi
